<script id="initial" type="application/json">/*CASE*/</script><script>'use strict';
const el=id=>document.getElementById(id);
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sourceURL=value=>/^https?:\/\//i.test(String(value))?value:'';
const nameOf=n=>n.label.replace(/^0[1-9]\s+/,'');
const initial=JSON.parse(el('initial').textContent), registry=new Map([[initial.key,initial]]);
let project, index, parents, scope, selected, mode='local', history=[], context=null, files=[], candidate=null, token='',busy=false;
function ancestry(n){const list=[];while(n){list.unshift(n);n=parents.get(n.id)}return list}
function flatten(n){const a=[n];for(const c of n.children||[])a.push(...flatten(c));return a}
function setProject(p){
 project=p;index=new Map();parents=new Map();
 function visit(n,parent){index.set(n.id,n);parents.set(n.id,parent);for(const c of n.children||[])visit(c,n)}visit(p.tree,null);
 scope=p.tree;selected=scope;history=[];mode='all';
 el('projects').innerHTML=[...registry].map(([id,v])=>'<option value="'+escapeHTML(id)+'">'+escapeHTML(v.title)+'</option>').join('');
 el('projects').value=p.key;render();
}
function remember(){history.push([scope.id,selected.id,mode,linkStep]);if(history.length>90)history.shift()}
function go(id,keepScope=false){if(document.body.classList.contains('wide-map'))setWideMap(false);const n=index.get(id);if(!n)return;remember();if(!keepScope)scope=n.children?.length?n:parents.get(id)||n;selected=n;mode='local';render();if(innerWidth<790&&!n.children?.length)el('dossier').scrollIntoView({block:'start'})}
function metricList(n){
 if(project.highlights?.[n.id]?.length)return project.highlights[n.id];
 const found=[];for(const c of flatten(n)){if(c.metric&&c.refs?.length)found.push({ref:c.id,value:c.metric,label:c.metric_label||c.label,kind:c.kind})}
 return found.slice(0,4)
}
function evidenceOf(n){return (n.refs||[]).map(k=>project.sources[k]).filter(Boolean)}
function chartPanel(spec){
 const rows=spec.rows||[];
 if(!rows.length||rows.some(r=>!Array.isArray(r)||!Number.isFinite(r[1])))return '';
 const fmt=v=>v.toLocaleString('zh-CN',{maximumFractionDigits:3}),unit=escapeHTML(spec.unit||''),points=rows.map(r=>r[1]),total=points.reduce((sum,v)=>sum+v,0);
 const tone=i=>'var(--plot'+(i%4)+')';
 let body='';
 if(spec.kind==='ring'&&total>0&&points.every(v=>v>=0)){
  let offset=0;const segments=rows.map(([label,v],i)=>{const share=v/total*100;
   const circle='<circle cx="53" cy="53" r="40" pathLength="100" fill="none" stroke="'+tone(i)+'" stroke-width="9" stroke-dasharray="'+Math.max(0,share-.7)+' 100" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 53 53)"/>';offset+=share;return circle});
  body='<div class="donutbox"><svg viewBox="0 0 106 106" aria-hidden="true">'+segments.join('')+'<text x="53" y="52" text-anchor="middle" font-size="17">'+fmt(total)+'</text><text x="53" y="67" text-anchor="middle" class="minor" font-size="9">'+unit+'</text></svg><div>'+rows.map(([label,v],i)=>'<div class="plotkey"><i style="background:'+tone(i)+'"></i><span>'+escapeHTML(label)+'</span><b>'+fmt(v)+'</b></div>').join('')+'</div></div>'
 }else if(spec.kind==='slope'&&rows.length===2){
  const max=Math.max(1,...points)*1.14;const y=v=>78-v/max*60;
  body='<svg viewBox="0 0 256 94" class="slope" role="img" aria-label="'+escapeHTML(rows.map(r=>r[0]+' '+r[1]+spec.unit).join('，'))+'"><path d="M30 78H226" class="axis"/><path d="M30 '+y(points[0])+' L226 '+y(points[1])+'" class="trend"/>'+rows.map(([label,v],i)=>{let x=i?226:30;return '<circle cx="'+x+'" cy="'+y(v)+'" r="4" fill="'+tone(i)+'"/><text x="'+(i?242:14)+'" y="'+(y(v)-9)+'" text-anchor="'+(i?'end':'start')+'" font-size="13">'+fmt(v)+'</text><text x="'+(i?242:14)+'" y="92" text-anchor="'+(i?'end':'start')+'" class="minor" font-size="10">'+escapeHTML(label)+'</text>'}).join('')+'</svg>'
 }else{
  const hi=spec.unit==='%'&&points.every(v=>v>=0&&v<=100)?100:Math.max(0,...points);
  const lo=Math.min(0,...points),span=hi-lo||1,zero=-lo/span*100;
  body=rows.map(([label,v],i)=>'<div class="plotrow"><span>'+escapeHTML(label)+'</span><strong>'+fmt(v)+'</strong><div class="plottrack"><i class="zero" style="left:'+zero+'%"></i><i class="plotfill" style="left:'+Math.min(zero,(v-lo)/span*100)+'%;width:'+Math.abs(v)/span*100+'%;background:'+(v<0?'var(--negative)':tone(i))+'"></i></div></div>').join('')
 }
 return '<section class="data-plate"><div class="plothead"><b>'+escapeHTML(spec.title)+'</b><small>'+unit+'</small></div>'+body+'<p class="plotnote">'+escapeHTML(spec.caption||'')+'</p>'+((spec.refs||[]).length?'<details class="plotrefs"><summary>查看数据依据</summary>'+spec.refs.filter(id=>index.has(id)).map(id=>'<button data-id="'+escapeHTML(id)+'">'+escapeHTML(nameOf(index.get(id)))+' ↗</button>').join('')+'</details>':'')+'</section>'
}
function dossierPlots(n){
 const legacy=project.charts?.[n.id],specs=[...(project.panels?.[n.id]||[])];
 if(legacy)specs.unshift({kind:'bars',title:legacy.title,unit:legacy.rows[0][2],rows:legacy.rows.map(r=>r.slice(0,2)),caption:legacy.caption,refs:legacy.refs});
 if(!specs.length&&n.children?.length){
  const counts=new Map();for(const c of flatten(n)){if(c.children?.length)continue;const key=c.kind||'条目';counts.set(key,(counts.get(key)||0)+1)}
  if(counts.size>1)specs.push({kind:'ring',title:'本分支的证据构成',unit:'个节点',rows:[...counts],caption:'按节点类型计数，每个末级条目计一次。'})
 }
 return specs.map(chartPanel).join('')
}
function routeList(n){return (project.links||[]).filter(l=>l.start===n.id||l.end===n.id)}
function svgText(x,y,s,cl='',size=13){return '<text x="'+x+'" y="'+y+'" font-size="'+size+'" class="'+cl+'">'+escapeHTML(s)+'</text>'}
function pieces(text,width){const chars=[...text],lines=[];let s='',len=0;for(const c of chars){let w=c.charCodeAt(0)>255?1:.58;if(len+w>width){lines.push(s);s='';len=0}s+=c;len+=w}if(s)lines.push(s);return lines}
let linkStep=0;
function drawGraph(){
 const area=el('graph'), active=scope.children||[], all=mode==='all';
 el('relations').classList.toggle('active',mode==='links');el('mapMode').classList.toggle('active',all);
 el('mapMode').textContent=all?'当前层级':'全部节点';el('relations').textContent=mode==='links'?'返回图谱':'关系链';
 if(mode==='links'){
  const subtree=new Set(flatten(scope).map(n=>n.id));
  const links=(project.links||[]).filter(l=>subtree.has(l.start)||subtree.has(l.end));
  el('graphTitle').textContent='因素之间如何传导';
  if(!links.length){area.innerHTML='<article class="route"><p>本层记录的是资料归属。当前分支暂无已记录的传导路径。</p></article>';return}
  linkStep=Math.max(0,Math.min(linkStep,links.length-1));
  const l=links[linkStep],left=index.get(l.start),right=index.get(l.end);
  const endpoint=(node,label)=>'<button class="relation-node" data-id="'+escapeHTML(node.id)+'"><small>'+label+'</small><strong>'+escapeHTML(nameOf(node))+'</strong><span>展开节点 ↗</span></button>';
  area.innerHTML='<div class="flow"><div class="flow-top"><span>传导关系　'+String(linkStep+1).padStart(2,'0')+' / '+String(links.length).padStart(2,'0')+'</span><div><button id="prevLink" '+(!linkStep?'disabled':'')+'>←</button> <button id="nextLink" '+(linkStep===links.length-1?'disabled':'')+'>下一条 →</button></div></div><div class="flow-path nodeReveal">'+endpoint(left,'起点')+'<div class="conduit"><span>'+escapeHTML(l.label)+'</span><i></i></div>'+endpoint(right,'作用对象')+'</div><div class="explain"><small>'+escapeHTML(l.status)+'</small><p>'+escapeHTML(l.reason)+'</p></div><div class="linkindex">'+links.map((item,i)=>'<button data-step="'+i+'" class="'+(linkStep===i?'active':'')+'">'+escapeHTML(nameOf(index.get(item.start)))+' → '+escapeHTML(nameOf(index.get(item.end)))+'</button>').join('')+'</div></div>';
  const support=document.createElement('div');support.className='tools';
  for(const [role,n] of [['起点依据',left],['作用对象依据',right]]){
   const leaf=flatten(n).find(v=>v.refs?.length)||flatten(n).find(v=>v.note&&v.kind==='推演');if(!leaf)continue;
   const button=document.createElement('button');button.dataset.id=leaf.id;
   button.textContent=role+' · '+(evidenceOf(leaf)[0]?.org||'情景算式')+' ↗';support.append(button)
  }
  area.querySelector('.explain').append(support);
  el('prevLink').onclick=()=>{linkStep--;drawGraph()};el('nextLink').onclick=()=>{linkStep++;drawGraph()};
  area.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{linkStep=Number(b.dataset.step);drawGraph()});
  return
 }
 const count=flatten(scope).length;
 el('graphTitle').textContent=(all?'全景':'当前关系')+' · '+count+' 个节点';
 paintNetwork(area,scope,all);
}
// Radial overview and a two-sided local tree share a stable node identity.
function paintNetwork(area,center,all){
 const list=center.children||[],radial=all&&list.length>=3&&list.length<=14;
 const W=1060,H=radial?550:Math.max(315,Math.ceil(list.length/2)*91+80),cx=W/2,cy=H/2;
 const leafSizes=new Map();function size(n){const total=n.children?.length?n.children.reduce((v,c)=>v+size(c),0):1;leafSizes.set(n,total);return total}size(center);
 const coords=list.map((n,i)=>{
  const theta=-Math.PI*.875+i*Math.PI*2/list.length,side=i%2===0?-1:1;
  return {n,i,theta,x:radial?cx+Math.cos(theta)*274:cx+side*280,y:radial?cy+Math.sin(theta)*145:cy+(Math.floor(i/2)-(Math.ceil(list.length/2)-1)/2)*91}
 });
 const branches=[],dots=[],wires=[],cards=[];
 for(const {n,i,theta,x,y} of coords){
  let cursor=0;const half=radial?Math.PI/list.length*.98:.0,subrows=n.children?.length||0;
  function descend(child,px,py,depth){
   const total=leafSizes.get(child),t=(cursor+total*.5)/leafSizes.get(n),phi=theta+(t*2-1)*half;
   const inner=!!child.children?.length;
   const r=inner?Math.min(.94,.62+depth*.095):.935+.050*Math.sin((cursor+i)*1.73);
   // In the branch view descendants sit beyond their parent, in the same row.
   const xx=radial?cx+Math.cos(phi)*(W/2-16)*r:x+(x<cx?-1:1)*(inner?110+depth*17:185+(cursor%6)*6);
   const yy=radial?cy+Math.sin(phi)*(H/2-12)*r:y+(t-.5)*(list.length>2?74:148);
   wires.push('<path class="stellar-wire" d="M '+px+' '+py+' Q '+((px+xx)/2)+' '+(py*.37+yy*.63)+' '+xx+' '+yy+'"/>');
   const id=escapeHTML(child.id),tip=escapeHTML(nameOf(child)),rr=inner?(depth===1?3.1:2.2):1.65;
   dots.push('<circle class="starlit" data-id="'+id+'" cx="'+xx+'" cy="'+yy+'" r="'+rr+'"><title>'+tip+'</title></circle>');
   if(inner)child.children.forEach(c=>descend(c,xx,yy,depth+1));else cursor++
  }
  if(subrows)n.children.forEach(c=>descend(c,x,y,1));
  branches.push('<path class="wire trace" style="--delay:'+i*.022+'s" pathLength="1" d="M '+cx+' '+cy+' Q '+(cx+(x-cx)*.62)+' '+(cy+(y-cy)*.30)+' '+x+' '+y+'"/>');
  const w=radial?156:210,h=radial?45:62,lines=pieces(nameOf(n),radial?10:14);
  const label=radial?(lines[0]+(lines.length>1?'…':'')):lines[0];
  cards.push('<g class="point nodeReveal '+(selected===n?'chosen':'')+'" role="button" tabindex="0" aria-label="'+escapeHTML(n.label)+'" data-id="'+escapeHTML(n.id)+'" style="--delay:'+Math.min(.26,i*.033)+'s"><title>'+escapeHTML(nameOf(n))+'</title><rect x="'+(x-w/2)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" rx="8"/>'+svgText(x-w/2+12,y-(radial?7:12),n.children?.length?(n.role||'分支')+'  /  '+n.children.length:(n.kind||'证据'),'minor',9)+svgText(x-w/2+12,y+10,label,'',radial?14:15)+(!radial&&lines[1]?svgText(x-w/2+12,y+24,lines[1]+(lines[2]?'…':''),'minor',11):'')+'</g>')
 }
 let rings='';if(radial)for(const [rx,ry] of [[112,67],[224,121],[356,190],[492,246]])rings+='<ellipse class="survey-ring" cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'"/>';
 const mid=pieces(nameOf(center),9),hub='<g class="hub"><circle class="hub-aura" cx="'+cx+'" cy="'+cy+'" r="91"/><circle class="ring" cx="'+cx+'" cy="'+cy+'" r="76" stroke-dasharray="2 7"/><circle class="orb" cx="'+cx+'" cy="'+cy+'" r="62"/><g text-anchor="middle">'+svgText(cx,cy-16,'CURRENT FOCUS','mark',8)+svgText(cx,cy+7,mid[0]||'','',16)+svgText(cx,cy+26,mid[1]||'','minor',11)+'</g></g>';
 area.innerHTML='<svg class="atlas-map" viewBox="0 0 '+W+' '+H+'" aria-label="主题及关联节点">'+rings+'<g class="star-traces">'+wires.join('')+'</g><g class="star-field">'+dots.join('')+'</g>'+branches.join('')+cards.join('')+hub+'</svg>';
 const groups=list.filter(n=>n.children?.length);
 if(all&&center===project.tree&&groups.length){
  const shortcuts=document.createElement('div');shortcuts.className='map-shortcuts';
  shortcuts.innerHTML='<label>二级入口 <select aria-label="选择二级入口所属分支">'+groups.map(n=>'<option value="'+escapeHTML(n.id)+'">'+escapeHTML(nameOf(n))+'</option>').join('')+'</select></label><div class="shortcut-items"></div>';
  area.append(shortcuts);
  const chooser=shortcuts.querySelector('select'),items=shortcuts.querySelector('.shortcut-items');
  function choose(n){chooser.value=n.id;items.innerHTML=n.children.map(c=>'<button data-id="'+escapeHTML(c.id)+'">'+escapeHTML(nameOf(c))+' ↗</button>').join('')}
  chooser.onchange=()=>choose(index.get(chooser.value));choose(groups[0]);
  for(const card of area.querySelectorAll('.point')){
   const n=index.get(card.dataset.id);if(!n?.children?.length)continue;
   card.addEventListener('pointerenter',()=>choose(n));card.addEventListener('focus',()=>choose(n))
  }
 }
 const svg=area.firstElementChild;svg.style.transformOrigin=mapOrigin;mapOrigin='50% 50%';
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)svg.animate([{opacity:.10,transform:'scale(.90)'},{opacity:1,transform:'scale(1)'}],{duration:550,easing:'cubic-bezier(.18,.74,.2,1)'})
}
let mapOrigin='50% 50%';

function showDossier(){
 const n=selected,refs=evidenceOf(n),a=ancestry(n);
 const photo=[...a].reverse().map(v=>project.photos?.[v.id]).find(Boolean);
 const route=routeList(n),alias=metricList(scope).find(m=>m.ref===n.id),heading=alias?alias.value+'｜'+alias.label:nameOf(n);
 let html=(photo?'<button class="photo" id="photo"><img alt="'+escapeHTML(photo.caption)+'" src="'+escapeHTML(photo.url)+'"><span>⤢</span></button><div class="photo-note">'+escapeHTML(photo.caption)+'</div>':'')+'<span class="tag">'+escapeHTML(n.kind||n.role||'主题')+'</span><h3>'+escapeHTML(heading)+'</h3>';
 html+='<p>'+escapeHTML(n.note||n.finding||(n===project.tree?project.question:n.children?.length?'本层包含 '+n.children.length+' 个分支，选择一个分支继续讲解。':refs[0]?.scope||'该条目按项目方案记录。'))+'</p>';
 if(n.mechanism)html+='<div class="sub">传导机制</div><p>'+escapeHTML(n.mechanism)+'</p>';
 if(n.gap)html+='<div class="sub">待验证</div><p>'+escapeHTML(n.gap)+'</p>';
 html+=dossierPlots(n);
 if(refs.length)html+='<div class="sub">来源与统计口径</div>'+refs.map(s=>'<div class="source"><small>'+escapeHTML([s.org,s.date].filter(Boolean).join(' · '))+'</small>'+(sourceURL(s.url)?'<a target="_blank" rel="noopener noreferrer" href="'+escapeHTML(s.url)+'">'+escapeHTML(s.title)+' ↗</a>':'<b>'+escapeHTML(s.title)+'</b>')+'<p>'+escapeHTML(s.scope||'')+'</p></div>').join('');
 const fig=project.figures?.[n.id];if(fig&&sourceURL(fig.url)&&sourceURL(fig.image))html+='<div class="sub">'+escapeHTML(fig.title)+'</div><a href="'+escapeHTML(fig.url)+'" target="_blank" rel="noopener"><img loading="lazy" alt="查看来源原图 ↗" style="width:100%" src="'+escapeHTML(fig.image)+'"></a>';
 if(route.length)html+='<div class="sub">关联因子</div><div class="related">'+route.map(l=>{const outgoing=l.start===n.id, target=index.get(outgoing?l.end:l.start);return '<button data-id="'+escapeHTML(target.id)+'">'+(outgoing?'→ ':'← ')+escapeHTML(nameOf(target))+'<br><small>'+escapeHTML(l.label+' · '+l.status)+'</small></button>'}).join('')+'</div>';
 if(!refs.length&&n.children?.length){const samples=flatten(n).filter(v=>v!==n&&evidenceOf(v).length).slice(0,2);if(samples.length)html+='<div class="sub">可追溯证据</div><div class="related">'+samples.map(v=>'<button data-id="'+escapeHTML(v.id)+'">'+escapeHTML(nameOf(v))+' ↗</button>').join('')+'</div>'}
 const host=el('dossier');host.innerHTML=html;host.classList.remove('focusIn');void host.offsetWidth;host.classList.add('focusIn');
 if(photo)el('photo').onclick=()=>{el('figtitle').textContent=photo.caption;el('figimg').src=photo.url;el('figimg').alt=photo.caption;el('figure').showModal()}
}
function render(){
 const trail=ancestry(scope),main=scope===project.tree;
 el('path').innerHTML=trail.map(n=>'<button data-id="'+escapeHTML(n.id)+'">'+escapeHTML(nameOf(n))+'</button>').join('　/　');
 el('type').textContent=main?'主题全景':'第 '+(trail.length-1)+' 层 · '+(scope.role||'关系分支');
 el('title').textContent=main?project.title:nameOf(scope);el('question').textContent=main?project.question:scope.finding||scope.note||trail.map(nameOf).join('　›　');
 el('back').disabled=!history.length;
 el('nav').innerHTML=(scope.children||[]).map((n,i)=>{
  const title='<button data-id="'+escapeHTML(n.id)+'" class="'+(n===selected?'active':'')+'"><small>'+String(i+1).padStart(2,'0')+'</small><span>'+escapeHTML(nameOf(n))+'</span></button>';
  if(!n.children?.length||!main)return title;

 }).join('');

 el('inventory').textContent=index.size+' 个节点 / '+Object.keys(project.sources||{}).length+' 个来源';
 const metrics=metricList(scope);el('metrics').innerHTML=metrics.map(m=>{const n=index.get(m.ref),s=n&&evidenceOf(n)[0];return '<button class="metric '+(m.kind==='推演'?'calc':'')+'" data-metric="'+escapeHTML(m.ref)+'"><strong>'+escapeHTML(m.value)+'</strong><span>'+escapeHTML(m.label)+'</span><small>'+escapeHTML([s?.org,s?.date].filter(Boolean).join(' · ')||m.kind||'调查指标')+'</small></button>'}).join('');
 if(!metrics.length){el('metrics').innerHTML=['分支数','有出处的节点','待验证问题'].map((s,i)=>'<div class="metric"><strong>'+[scope.children?.length||0,flatten(scope).filter(n=>n.refs?.length).length,flatten(scope).filter(n=>n.gap||n.kind==='待验证').length][i]+'</strong><span>'+s+'</span><small>图谱结构统计</small></div>').join('')}
 showDossier();drawGraph();
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('dialog[open]')&&document.body.classList.contains('wide-map'))setWideMap(false)});
el('mapMode').onclick=()=>{remember();mode=mode==='all'?'local':'all';drawGraph();el('back').disabled=false};
el('relations').onclick=()=>{remember();linkStep=0;mode=mode==='links'?'local':'links';drawGraph();el('back').disabled=false};
function applyTheme(light){document.body.classList.toggle('light',light);el('theme').textContent=light?'深色':'浅色'}
function findNodes(){
 const q=el('findText').value.trim().toLowerCase();
 const results=q?[...index.values()].filter(n=>[n.label,n.finding,n.note,...evidenceOf(n).map(s=>s.org)].filter(Boolean).join(' ').toLowerCase().includes(q)):project.tree.children||[];
 el('hits').innerHTML=results.slice(0,35).map(n=>'<button data-hit="'+escapeHTML(n.id)+'"><strong>'+escapeHTML(nameOf(n))+'</strong><small>'+escapeHTML(ancestry(n).slice(0,-1).map(nameOf).join(' › '))+'</small></button>').join('')||'<p>没有匹配的节点。</p>';
 el('hits').querySelectorAll('[data-hit]').forEach(b=>b.onclick=()=>{el('finder').close();go(b.dataset.hit)})
}
el('find').onclick=()=>{el('findText').value='';findNodes();el('finder').showModal();el('findText').focus()};el('findText').oninput=findNodes;
el('present').onclick=()=>{const on=document.body.classList.toggle('presenting');el('present').textContent=on?'退出讲解':'讲解模式'};
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&document.body.classList.contains('presenting'))el('present').click();
 if(e.target.closest('input,textarea,select,dialog')||document.querySelector('dialog[open]'))return;
 if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();el('find').click()}
 if(mode==='links'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();el(e.key==='ArrowLeft'?'prevLink':'nextLink')?.click()}
});
applyTheme(matchMedia('(prefers-color-scheme: light)').matches);el('theme').onclick=()=>applyTheme(!document.body.classList.contains('light'));
setProject(initial);</script></body></html>
