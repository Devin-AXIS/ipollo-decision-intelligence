<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPollo 决策情报</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{--bg:#121b23;--glass:#20313bcc;--line:#a3c0c332;--ink:#e5eff1;--muted:#a1b4bc;--accent:#a8e3d8;--field:#12242b;color-scheme:dark;color:var(--ink);background:radial-gradient(at top left,#304750,transparent 64%),var(--bg);font:14px/1.5 "Instrument Sans","PingFang SC",system-ui,sans-serif}
body.light{--bg:#edf2f3;--glass:#f5fafad9;--line:#637b7f40;--ink:#172e34;--muted:#4c626a;--accent:#085e60;--field:#ffffffa6;color-scheme:light;background:radial-gradient(at left top,#cbdfdf,transparent 68%),var(--bg)}
#shell{height:100%;display:grid;grid-template-columns:clamp(220px,19vw,280px) minmax(0,1fr)}aside{padding:22px 16px;background:var(--glass);backdrop-filter:blur(18px);border-right:1px solid var(--line);overflow:auto}h1{font-size:21px;letter-spacing:-.06em;margin:0 0 20px;font-weight:650}label,.group{display:block;margin:15px 0 6px;font-weight:600;color:var(--muted);font-size:12px}select,textarea,button,.upload{font:inherit;color:inherit;border:1px solid var(--line);border-radius:9px;background:var(--field);padding:8px 10px}textarea,select{width:100%}textarea{resize:vertical;min-height:110px}
button,.upload,summary{cursor:pointer}button:hover,.upload:hover{border-color:var(--accent)}button:disabled{opacity:.48;cursor:default}.upload{font-weight:500;margin:6px 0;display:inline-block}.upload:focus-within{outline:2px solid var(--accent)}input[type=file]{position:absolute;width:1px;height:1px;clip-path:inset(50%)}.primary{width:100%;background:var(--accent);color:var(--bg);border:0;margin-top:10px;font-weight:650}
#notice,#fileinfo,.note{font-size:12px;line-height:1.6;color:var(--muted);overflow-wrap:anywhere}#notice{color:var(--accent)}#reports{display:grid;gap:5px}#reports button{text-align:left;overflow-wrap:anywhere}#reports button[aria-current=true]{border-color:var(--accent)}small{display:block;color:var(--muted)}main{display:flex;flex-direction:column;min-width:0;min-height:0}header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--line)}header strong{margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:54%}header button{font-size:12px}iframe{width:100%;flex:1;border:0;min-height:0;background:var(--bg)}#shell.collapsed{grid-template-columns:minmax(0,1fr)}#shell.collapsed aside{display:none}dialog{color:var(--ink);background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(400px,90vw)}dialog::backdrop{background:#111a2099}a{color:var(--accent);overflow-wrap:anywhere}button:focus-visible,summary:focus-visible{outline:2px solid var(--accent)}@media(max-width:720px){#shell{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}aside{max-height:40vh;border-right:0;border-bottom:1px solid var(--line);padding:10px 16px}h1{margin:0 0 7px}textarea{min-height:62px}#shell.collapsed{grid-template-rows:minmax(0,1fr)}header strong{max-width:34%}}
</style><body><div id="shell"><aside><h1>iPollo 决策情报</h1>
<label for="workspace">工作区</label><select id="workspace"><option value="">请选择工作区</option></select>
<label for="topic">你要做什么决定？</label><textarea id="topic" maxlength="4000" placeholder="例如，利用现有办公空间部署边缘算力，需要满足哪些条件？"></textarea>
<label class="upload">导入 PPTX<input id="ppt" type="file" accept=".pptx"></label> <button id="clearFile" hidden>移除</button><div id="fileinfo"></div>
<button id="generate" class="primary" disabled>生成决策图谱</button><p class="note">主题和幻灯片文字会交给当前工作区的 AI 调查。</p>
<p id="notice" role="status"></p><div class="group">本工作区的调查　<button id="refresh">刷新</button></div><div id="reports"></div><label class="upload">导入已有图谱 JSON<input id="import" type="file" accept=".json"></label><details><summary>查看示例</summary><button id="sample">储能产业链</button></details>
</aside><main><header><button id="toggle" aria-expanded="true">收起输入</button><strong id="current">储能产业链 · 示例</strong><button id="download">下载讲解网页</button><button id="publish" disabled>发布给访客</button></header>
<iframe id="viewer" title="决策情报讲解图谱" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe></main></div>
<dialog id="confirm"><h2>发布所选版本</h2><p id="publicTitle"></p><p>持有链接的人可查看完整图谱、数据和引用来源。原始 PPT 与调查对话留在工作区。</p><p id="shareStatus" role="status"></p><a id="shareLink" hidden target="_blank" rel="noopener">打开访客网页 ↗</a><p><button id="close">关闭</button> <button id="submitPublish">确认发布</button></p></dialog><script src="/ipollo-decision-intelligence/editor.js"></script></body></html>
