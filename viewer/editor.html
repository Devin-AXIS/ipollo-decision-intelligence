<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPollo 决策情报</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{--bg:#121b23;--glass:#20313b;--line:#a3c0c332;--ink:#e5eff1;--muted:#a1b4bc;--accent:#a8e3d8;--field:#12242b;display:flex;flex-direction:column;color-scheme:dark;color:var(--ink);background:var(--bg);font:13px/1.5 "Instrument Sans","PingFang SC",system-ui,sans-serif}
body.light{--bg:#edf2f3;--glass:#f5fafa;--line:#637b7f40;--ink:#172e34;--muted:#4c626a;--accent:#085e60;--field:#fff;color-scheme:light}
header{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px;border-bottom:1px solid var(--line)}
select{flex:1 1 130px;min-width:0;max-width:100%;text-overflow:ellipsis}
select,button{font:inherit;color:inherit;border:1px solid var(--line);border-radius:7px;background:var(--field);padding:4px 8px}
button{cursor:pointer}
button:disabled{opacity:.48;cursor:default}
button:enabled:hover,select:hover{border-color:var(--accent)}
iframe{width:100%;flex:1;border:0;min-height:0;background:var(--bg)}
#empty{max-width:320px;margin:auto;text-align:center;padding:18px;color:var(--muted)}
#empty p{margin:0 0 10px}
#notice{color:var(--muted);padding:6px 10px;overflow-wrap:anywhere}
#notice:empty{display:none}
dialog{color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(340px,90vw)}
dialog::backdrop{background:#111a2099}
a{color:var(--accent)}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<body>
<header id="toolbar" hidden>
  <select id="versions" aria-label="工作区决策图谱"></select>
  <button id="download" disabled>下载图谱</button>
  <button id="publish" disabled>分享</button>
</header>
<div id="notice" role="status"></div>
<div id="empty" hidden><p>在左侧对话发需求或附上 PPT，让 AI 生成决策图谱。</p><button id="refresh">刷新</button></div>
<iframe id="viewer" title="决策图谱" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" hidden></iframe>
<dialog id="confirm">
  <h2>分享所选图谱</h2>
  <p id="publicTitle"></p>
  <p>持有链接的人可查看图谱、数据和引用来源。</p>
  <p id="shareStatus" role="status"></p>
  <a id="shareLink" hidden target="_blank" rel="noopener">打开访客网页 ↗</a>
  <p><button id="close">关闭</button> <button id="submitPublish">确认发布</button></p>
</dialog>
<script src="/ipollo-decision-intelligence/editor.js"></script>
</body>
</html>
